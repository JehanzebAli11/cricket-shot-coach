[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cricket-shot-coach"
version = "0.1.0"
description = "Week-1 prototype: pose keypoints and form metrics for cricket batting shots."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jehanzeb Ali", email = "jehanzebali111@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
video = ["opencv-python>=4.8", "mediapipe>=0.10.14"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["pose"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
